name: flutter_dev_intelligence
description: >-
  Evidence-based Flutter developer diagnostics toolkit for build issues,
  UI quality checks, and runtime performance investigation.
version: 1.0.3
homepage: https://pub.dev/packages/flutter_dev_intelligence
repository: https://github.com/Chinmay2237/flutter_dev_intelligence
issue_tracker: https://github.com/Chinmay2237/flutter_dev_intelligence/issues
documentation: https://pub.dev/documentation/flutter_dev_intelligence/latest/

false_secrets:
  - /test/security_privacy_autofix_test.dart

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  analyzer: ^9.0.0
  yaml: ^3.1.2
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

executables:
  flutter_dev_intelligence: flutter_dev_intelligence
  flutter-dev: flutter_dev_intelligence

topics:
  - flutter
  - developer-tools
  - debugging
  - performance
  - accessibility

